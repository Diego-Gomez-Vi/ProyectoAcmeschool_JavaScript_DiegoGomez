<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentar Examen | Acme School</title>

    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/resolver.css">
</head>
<body>

    <header class="header">

        <h1>Presentar Examen</h1>

        <a
            href="./resolver.html"
            class="btn-back"
        >
            Volver
        </a>

    </header>

    <main class="resolver-container">

        <section class="exam-list-section">

            <h2 id="examTitle">
                Examen seleccionado
            </h2>

            <form id="studentForm">

                <input
                    type="text"
                    id="studentName"
                    placeholder="Nombre completo"
                    required
                >

                <input
                    type="text"
                    id="studentId"
                    placeholder="Número de identificación"
                    required
                >

                <button type="submit">
                    Iniciar Examen
                </button>

            </form>

        </section>

    </main>

    <script
        type="module"
        src="./js/resolver/presentar-examen.js"
    ></script>

</body>
</html>
